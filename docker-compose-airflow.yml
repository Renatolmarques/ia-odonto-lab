# =============================================================================
# Airflow — Workflow Orchestrator for IA Odonto Lab
# =============================================================================
# Replaces VPS crontab for Bronze → Silver pipeline and disaster-recovery backups.
# Runs as a standalone stack, connects to stack-ia_default network after startup.
#
# Start:  docker-compose -f docker-compose-airflow.yml up -d
# Stop:   docker-compose -f docker-compose-airflow.yml down
# Logs:   docker logs ia_airflow --tail 50 -f
#
# After first start, connect to existing networks:
#   docker network connect stack-ia_default ia_airflow
#   docker network connect ia-odonto-lab_default ia_airflow
#
# Web UI: ssh -p 59030 -L 8082:127.0.0.1:8082 root@217.216.65.38 -N
#         → http://localhost:8082
#         Login: admin / (AIRFLOW_ADMIN_PASSWORD from .env.airflow)
# =============================================================================

version: "3.8"

services:
  airflow:
    image: apache/airflow:2.9.1-python3.11
    container_name: ia_airflow
    restart: unless-stopped

    # ------------------------------------------------------------------
    # User — run as airflow (UID 50000) with docker group (GID 112)
    # GID 112 = docker group on the host VPS (confirmed via stat /var/run/docker.sock)
    # Required so BashOperator can call docker exec/run on the host
    # ------------------------------------------------------------------
    user: "50000:112"

    # ------------------------------------------------------------------
    # Environment — all sensitive values come from .env.airflow file
    # ------------------------------------------------------------------
    env_file:
      - /opt/ia-odonto-lab/.env.airflow

    environment:
      # Core Airflow config
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOGS_FOLDER: /opt/airflow/logs

      # PostgreSQL metadata database — production-grade, supports LocalExecutor
      # multi-write and concurrent task logging (vs SQLite which locks under load)
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass_2026@ia-odonto-db:5432/airflow

      # Webserver
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: 8080
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"

      # Email alerts via Outlook SMTP (renato_marques_17@hotmail.com)
      # Requires app password — not your regular Microsoft account password
      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_PORT: "587"
      AIRFLOW__SMTP__SMTP_STARTTLS: "true"
      AIRFLOW__SMTP__SMTP_SSL: "false"

      # Pipeline paths — must match VPS filesystem mounted as volumes
      BRONZE_PATH: /app/data_lake/bronze
      SILVER_PATH: /app/data_lake/silver
      DBT_PROJECT_PATH: /app/data_lake/silver/ia_odonto_silver
      DBT_PROFILES_DIR: /app/data_lake/silver/ia_odonto_silver

    # ------------------------------------------------------------------
    # Ports — bound to 127.0.0.1 only (UFW bypass protection)
    # Exposed via Nginx Proxy Manager → airflow.lumina-automacao.com.br
    # ------------------------------------------------------------------
    ports:
      - "127.0.0.1:8082:8080"

    # ------------------------------------------------------------------
    # Volumes
    # ------------------------------------------------------------------
    volumes:
      # DAG files — mounted from project repo (updated via CD pipeline)
      - /opt/ia-odonto-lab/dags:/opt/airflow/dags:ro

      # Persistent Airflow metadata and logs
      - airflow_data:/opt/airflow

      # Docker socket — required for BashOperator to run docker exec/run
      # Group GID 112 (docker) added to user above grants write access
      - /var/run/docker.sock:/var/run/docker.sock

      # Bronze data — read access for validation task
      - /opt/ia-odonto-lab/data_lake/bronze:/app/data_lake/bronze:ro

      # Silver data — read access for monitoring
      - /opt/ia-odonto-lab/data_lake/silver:/app/data_lake/silver:ro

      # Backup directory — writable by Airflow user (uid 50000)
      # /root/backups is NOT used — /root is drwx------ and blocks uid 50000
      # even with chmod 777 on the subdirectory itself
      - /opt/ia-odonto-lab/backups:/opt/ia-odonto-lab/backups

      # Logs
      - /opt/ia-odonto-lab/logs:/app/logs

    # ------------------------------------------------------------------
    # Entrypoint — migrates DB and creates admin user on first run,
    # then starts scheduler + webserver (LocalExecutor, single container)
    # ------------------------------------------------------------------
    entrypoint: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --firstname Renato
          --lastname Marques
          --role Admin
          --email $${AIRFLOW_SMTP_USER}
          --password $${AIRFLOW_ADMIN_PASSWORD} || true &&
        airflow scheduler &
        airflow webserver
      "

    # ------------------------------------------------------------------
    # Resource limits — conservative for shared VPS (5.5GB available RAM)
    # Airflow LocalExecutor + PostgreSQL uses ~500-700MB in practice
    # ------------------------------------------------------------------
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 400M

    # ------------------------------------------------------------------
    # Networks — ia_airflow_default created here
    # stack-ia_default and ia-odonto-lab_default connected post-start
    # (see startup instructions above)
    # ------------------------------------------------------------------
    networks:
      - default
      - ia-odonto-lab_default

# ------------------------------------------------------------------
# Named volumes
# ------------------------------------------------------------------
volumes:
  airflow_data:
    name: ia_airflow_data

# ------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------
networks:
  default:
    name: ia_airflow_default
  ia-odonto-lab_default:
    external: true