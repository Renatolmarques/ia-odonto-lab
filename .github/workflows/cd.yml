name: CD — Deploy VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 59030
          script: |
            set -e
            cd /opt/ia-odonto-lab
            git fetch origin main
            git reset --hard origin/main
            # Docker Compose v2 reads docker-compose.yml and handles everything declaratively:
            # - builds the image from the updated Dockerfile
            # - connects to both networks (ia-odonto-lab_default + stack-ia_default)
            # - binds port to 127.0.0.1:8000 only (loopback — no external exposure)
            # - mounts all volumes (bronze, silver, logs)
            # - applies restart policy (unless-stopped)
            # No manual docker network connect needed — eliminates the race condition
            # where the container lost its stack-ia_default connection on redeploy.
            # --no-deps: do not recreate db or dbt — only manage the api container.
            # ia-odonto-db was created independently and must not be touched by CD.
            docker compose up -d --build --no-deps api