name: CD — Deploy VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 59030
          script: |
            set -e
            cd /opt/ia-odonto-lab
            git fetch origin main
            git reset --hard origin/main
            docker build -t ia-odonto-lab_api .
            docker stop ia-odonto-api 2>/dev/null || true
            docker rm ia-odonto-api 2>/dev/null || true
            docker run -d \
              --name ia-odonto-api \
              --restart unless-stopped \
              --network ia-odonto-lab_default \
              -p 127.0.0.1:8000:8000 \
              --env-file .env \
              -v /opt/ia-odonto-lab/data_lake/bronze:/app/data_lake/bronze \
              -v /opt/ia-odonto-lab/data_lake/silver:/app/data_lake/silver \
              -v /opt/ia-odonto-lab/logs:/app/logs \
              ia-odonto-lab_api