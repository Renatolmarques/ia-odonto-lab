# data_lake/silver/ia_odonto_silver/dbt_project.yml
# Silver layer transformation project for IA Odonto Lab.
# Reads partitioned Parquet files from the Bronze layer via DuckDB,
# applies SHA-256 anonymization and data quality rules,
# and materializes staging views and mart tables for analytics.

name: "ia_odonto_silver"
version: "1.0.0"
profile: "ia_odonto_silver"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ia_odonto_silver:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts