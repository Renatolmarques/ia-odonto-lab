version: 2

models:
  - name: stg_recebimentos
    description: >
      Staging model for billing data from EspoCRM MariaDB.
      Anonymizes patient identifiers with SHA-256 + salt (LGPD compliant).
      Filters invalid records (valor = 0, null contato_id).
    columns:
      - name: contato_hash
        description: SHA-256 hash of contato_id with salt — LGPD compliant
        tests:
          - not_null
      - name: valor
        description: Payment amount in BRL — always greater than zero
        tests:
          - not_null
      - name: moeda
        description: Currency code — always brl
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['brl']
      - name: data_recebimento
        description: Payment date
        tests:
          - not_null
      - name: status
        description: Payment status — normalized to lowercase
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pago', 'pendente', 'cancelado', 'estornado']

  - name: stg_contacts
    description: >
      Staging model for contact analytical fields from EspoCRM MariaDB.
      Passes through PII fields (nome, telefone, bairro, cidade, endereco_entrega)
      under LGPD legitimate interest for clinical identification.
      Anonymizes contact id with SHA-256 + salt (LGPD compliant).
      Sprint 2: includes 9 Sprint 1 analytical fields (c_c_* prefix).
      Excluded: c_c_fobias_dentarias (LGPD Art. 11 — health data).
    columns:
      - name: contato_hash
        description: SHA-256 hash of contact id with salt — LGPD compliant
        tests:
          - not_null
          - unique
      - name: status_atendimento
        description: Care status normalized to lowercase
        tests:
          - not_null
      - name: lifetime_value
        description: Numeric LTV in BRL — decimal(13,2)
        tests:
          - not_null:
              config:
                severity: warn
      - name: potencial_venda
        description: Numeric sales potential in BRL — decimal(13,2)
        tests:
          - not_null:
              config:
                severity: warn
      - name: qtd_consultas
        description: Total visit count — integer >= 0
        tests:
          - not_null
      - name: etapa_funil
        description: >
          Funnel stage written by Lina (Sprint 1). Null for contacts created
          before Sprint 1 deployment. Values: lead_novo, em_contato,
          orcamento_enviado, consulta_agendada, em_tratamento, finalizado.
        tests:
          - not_null:
              config:
                severity: warn
      - name: status_risco
        description: >
          Re-engagement risk tier calculated by n8n workflow (Sprint 1).
          Null for contacts without interaction history.
          Values: ativo (0-180d), em_risco (181-365d), perdido (366d+).
        tests:
          - not_null:
              config:
                severity: warn
      - name: origem_lead
        description: >
          Lead origin channel identified by Lina (Sprint 1).
          Examples: instagram, google, indicacao, anuncio_pago, nao_identificada.
        tests:
          - not_null:
              config:
                severity: warn
      - name: intencao_principal
        description: >
          Primary intent inferred by Lina from WhatsApp conversation (Sprint 1).
          Examples: agendamento, orcamento, duvida, reclamacao.
        tests:
          - not_null:
              config:
                severity: warn
      - name: procedimento_interesse
        description: >
          Dental procedure of interest identified by Lina (Sprint 1).
          Examples: implante, clareamento, ortodontia, limpeza.
        tests:
          - not_null:
              config:
                severity: warn

  - name: stg_ai_summaries
    description: >
      Staging model isolating AI-generated clinical summaries from stg_contacts.
      Adds quality signals (missing, empty, too_short, ok).
      Source: stg_contacts via ref() — never Bronze directly.
    columns:
      - name: contato_hash
        description: SHA-256 anonymized contact identifier
        tests:
          - not_null
          - unique
      - name: summary_quality
        description: Quality classification of AI summary
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ok', 'too_short', 'empty', 'missing']
      - name: summary_length
        description: Character length of AI summary
        tests:
          - not_null

  - name: stg_rag_audit
    description: >
      Staging model for RAG query logs exported from PostgreSQL rag_audit table.
      Each row represents one similarity search performed by Lina — either
      against the clinic knowledge base (clinica_docs) or patient episodic
      memory (patient_history). Powers fct_rag_performance for AI observability.
      Deduplication: ROW_NUMBER() over id keeps the most recent record when
      the same id appears across multiple daily Bronze Parquet partitions.
      Privacy: query stored as SHA-256 hash (LGPD compliant — raw text never
      reaches Silver); patient_id is also SHA-256 hash.
    columns:
      - name: id
        description: Surrogate key from PostgreSQL sequence — deduplicated
        tests:
          - not_null
          - unique
      - name: queried_at
        description: Timestamp of the RAG query
        tests:
          - not_null
      - name: query_date
        description: Date portion of queried_at — used for daily aggregation
        tests:
          - not_null
      - name: collection
        description: pgvector collection searched — clinica_docs or patient_history
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['clinica_docs', 'patient_history']
      - name: query_type
        description: Human-readable classification of the RAG call type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['knowledge_base', 'episodic_memory', 'unknown']
      - name: query_hash
        description: SHA-256 hash of the original query text — LGPD compliant
        tests:
          - not_null
      - name: query_category
        description: >
          Inferred intent category written by retriever_tool.py at query time.
          Examples: scheduling, pricing, procedure, complaint, general.
          Null for records written before this field was introduced.
        tests:
          - not_null:
              config:
                severity: warn
      - name: results_returned
        description: Number of chunks actually returned by the similarity search
        tests:
          - not_null
      - name: is_low_quality
        description: True if no results returned or avg_score below 0.5
        tests:
          - not_null

  - name: stg_opportunities
    description: >
      Staging model for opportunity data from EspoCRM MariaDB.
      Each row represents one treatment plan for a patient.
      Architectural decision (2026-05-28): no Consulta entity in EspoCRM.
      Each treatment = 1 Opportunity. Individual sessions are Stream notes.
      Anonymizes opportunity id and contact_id with SHA-256 + salt (LGPD compliant).
      contact_id is hashed to contato_hash to enable joins with stg_contacts
      and dim_patients without exposing raw EspoCRM UUIDs.
    columns:
      - name: opportunity_hash
        description: SHA-256 hash of opportunity id with salt — LGPD compliant
        tests:
          - not_null
          - unique
      - name: contato_hash
        description: >
          SHA-256 hash of contact_id with salt — matches stg_contacts.contato_hash.
          Used as FK to dim_patients in Gold layer.
        tests:
          - not_null
      - name: stage
        description: >
          Treatment stage normalized to lowercase — mirrors EspoCRM Opportunity stage.
          Examples: prospecting, qualificado, orcamento_enviado, consulta_agendada,
          em_tratamento, ganho, perdido.
        tests:
          - not_null:
              config:
                severity: warn
      - name: valor
        description: Treatment value in BRL — decimal(13,2). Zero if not yet defined.
        tests:
          - not_null:
              config:
                severity: warn
      - name: probabilidade
        description: Closing probability 0-100 as set in EspoCRM
        tests:
          - not_null:
              config:
                severity: warn
      - name: created_at
        description: Date the opportunity was created in EspoCRM
        tests:
          - not_null
      - name: modified_at
        description: Date of last modification — used for deduplication
        tests:
          - not_null
