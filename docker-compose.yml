# docker-compose.yml — Local development and VPS service definitions
# IA Odonto Lab | Sprint 8
#
# Services:
#   api      — FastAPI application with LangChain + pgvector (Lina AI)
#   db       — PostgreSQL 16 with pgvector extension (episodic memory store)
#   dbt      — Dedicated dbt + DuckDB container for Silver layer transformations
#              Uses Docker profile "dbt" so it does not start automatically.
#              Triggered on demand by Airflow or manually via docker run.
#   metabase — Business Intelligence dashboard (Sprint 2, 2026-06-13)
#              Uses PostgreSQL db 'metabase' on ia-odonto-db for persistence.
#              Previously run via manual docker run — now managed by compose.
#              Data is safe: dashboards/queries persist in PostgreSQL, not container.
#
# Networks:
#   default          — internal bridge network between api and db
#   stack-ia_default — external network shared with n8n, EspoCRM, Evolution API
#
# Security:
#   api port is bound to 127.0.0.1 only — prevents direct external access,
#   enforcing all traffic to flow through Cloudflare and Nginx Proxy Manager.
#   Docker bypasses UFW by default, so loopback binding is the only reliable
#   guarantee at the container level.
services:
  api:
    build: .
    container_name: ia-odonto-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - default
      - stack-ia_default
  db:
    image: pgvector/pgvector:pg16
    container_name: ia-odonto-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ia_odonto
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: ia-odonto-dbt
    volumes:
      # Bronze Parquet files — read-only to prevent accidental writes
      - ./data_lake/bronze:/app/data_lake/bronze:ro
      # Silver DuckDB database and compiled dbt artifacts
      - ./data_lake/silver:/app/data_lake/silver
      # Persistent logs outside the container filesystem
      - ./logs:/app/logs
    env_file:
      - .env
    # Does not restart automatically — triggered on demand by Airflow
    restart: "no"
    profiles:
      - dbt
    networks:
      - default
  metabase:
    image: metabase/metabase:latest
    container_name: ia_metabase
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_PASS: postgres
      MB_DB_HOST: ia-odonto-db
      JAVA_TIMEZONE: America/Sao_Paulo
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - default
volumes:
  pgdata:
networks:
  default:
    driver: bridge
  stack-ia_default:
    external: true